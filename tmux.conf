# ~/.tmux.conf -- plugin-free, tmux >= 3.2

# --- Prefix: C-a (press C-a twice to send a literal C-a) --------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- General -----------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"   # true colour (Windows Terminal)
set -s escape-time 10            # no lag on <Esc> in vim
set -g history-limit 50000
set -g mouse on
set -g focus-events on           # lets vim autoread on focus
set -g set-titles on
set -g set-titles-string "#S:#W"
set -g display-time 2000
setw -g aggressive-resize on

# Number windows/panes from 1 and keep them contiguous
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Reload ------------------------------------------------------------------
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# --- Windows & panes ---------------------------------------------------------
# Splits and new windows open in the current pane's directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# vim-style pane movement; Shift+hjkl resizes (repeatable)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Cycle windows with C-a C-h / C-a C-l, jump back with C-a Tab
bind -r C-h previous-window
bind -r C-l next-window
bind Tab last-window

# Quick session switcher
bind s choose-tree -Zs

# --- Copy mode (vi keys) -----------------------------------------------------
setw -g mode-keys vi
set -g status-keys emacs         # keep the : prompt readline-like
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X cancel

# Clipboard: OSC 52 works in Windows Terminal and over SSH; under WSL also
# pipe to clip.exe so yanks land in the Windows clipboard regardless.
set -s set-clipboard on
if-shell "command -v clip.exe >/dev/null 2>&1" \
    "bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'clip.exe'; \
     bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'clip.exe'" \
    "bind -T copy-mode-vi y send -X copy-selection-and-cancel"

# --- Look --------------------------------------------------------------------
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=colour235,fg=colour250"

set -g status-left-length 30
set -g status-left "#[bg=colour31,fg=colour255,bold] #S #[default] "
set -g status-right-length 60
set -g status-right "#{?client_prefix,#[bg=colour166 fg=colour255 bold] PREFIX #[default] ,}#[fg=colour245]#h  %a %d %b %H:%M "

setw -g window-status-format " #I:#W#{?window_zoomed_flag, [Z],} "
setw -g window-status-current-format "#[bg=colour238,fg=colour255,bold] #I:#W#{?window_zoomed_flag, [Z],} "
setw -g window-status-separator ""
setw -g window-status-activity-style "fg=colour214"
setw -g monitor-activity on
set -g visual-activity off

set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour31"
set -g message-style "bg=colour31,fg=colour255"
setw -g mode-style "bg=colour31,fg=colour255"

# --- Machine-local overrides (not in the repo) -------------------------------
# Sourced before plugins so it can also set @sidebar_* options.
if-shell "[ -f ~/.tmux.conf.local ]" "source-file ~/.tmux.conf.local"

# --- tmux-agent-sidebar (installed by setup.sh) ------------------------------
# prefix e: toggle sidebar in this window, prefix E: toggle in all windows.
# Options (set before this line, e.g. in ~/.tmux.conf.local):
#   @sidebar_width 15%  @sidebar_position left  @sidebar_auto_create on
if-shell "[ -x ~/.tmux/plugins/tmux-agent-sidebar/tmux-agent-sidebar.tmux ]" \
    "run-shell ~/.tmux/plugins/tmux-agent-sidebar/tmux-agent-sidebar.tmux"
